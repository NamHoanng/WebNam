<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sơ đồ cấu trúc trang web</title>
    
    <!-- Nhúng font chữ Roboto từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Phần CSS trang trí -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        /* Tiêu đề màu xanh */
        h1 {
            color: #0066cc;
        }

        /* Khối div chứa nội dung */
        div {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        /* --- CSS CHO HIỆU ỨNG BONG BÓNG --- */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 150, 255, 0.5);
            pointer-events: none;
            transform: scale(0);
            animation: bubble-animation 0.6s linear forwards;
        }

        @keyframes bubble-animation {
            to {
                transform: scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div>
        <h1>MY LIFE-MY CARE</h1>
        <p>ĐÂY là đoạn văn bản đầu tiên nằm trong khối div.</p>
        <hr>
        <p>ĐÂY là đoạn văn bản thứ hai nằm trong khối div.</p>
    </div>

    <p>Đoạn văn này có chứa một từ được <em>nhấn mạnh</em> bằng thẻ em.</p>
    <img src="images.jpg" alt="Hình ảnh minh họa">

    <!-- Phần JavaScript tạo hiệu ứng bong bóng và âm thanh khi click chuột -->
    <script>
        document.addEventListener('click', function (e) {
            // 1. Tạo hiệu ứng hình ảnh bong bóng
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = 30;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = (e.pageX - size / 2) + 'px';
            bubble.style.top = (e.pageY - size / 2) + 'px';
            
            document.body.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 600);

            // 2. Phát âm thanh tiếng "pop" (bong bóng vỡ)
            // Sử dụng âm thanh mẫu công khai từ kho lưu trữ âm thanh trực tuyến
            const popSound = new Audio('https://www.soundjay.com/buttons/sounds/button-37.mp3');
            popSound.volume = 0.5; // Điều chỉnh âm lượng (từ 0.0 đến 1.0)
            popSound.play().catch(error => {
                // Tránh lỗi trình duyệt chặn âm thanh khi chưa tương tác đủ
                console.log("Trình duyệt có thể chặn tự động phát âm thanh nếu chưa click lần đầu.");
            });
        });
    </script>

</body>
</html>
